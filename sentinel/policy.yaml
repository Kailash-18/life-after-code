# Project Sentinel — Canary & Rollout Health Policy
# Authoritative threshold definitions for canary progression and automated rollback decisions.
# Referenced by Sentinel Health Evaluator (sentinel/scripts/evaluator.py) and Deployment Controller.

version: "1.0"
service: "${TARGET_APP_SERVICE:-sentinel-target-app}"
environment: "${SENTINEL_ENV:-prod}"


# ==============================================================================
# DEPLOYMENT STRATEGIES & POST-INCIDENT RECOMMENDATIONS
# ==============================================================================
deployment_strategies:
  # The default and authoritative recommended deployment strategy for Sentinel recovery
  recommended: "canary_progressive"
  rationale: >-
    Progressive Canary with private URL tag isolation is strongly recommended.
    It guarantees 0% public traffic during initial synthetic health verification,
    limits user exposure to at most 10% during initial rollout, and provides sub-second
    Cloud Run traffic redirection back to known-good revisions without state loss.

  options:
    - id: "canary_progressive"
      name: "Progressive Canary Rollout (Tag Isolated)"
      recommended: true
      suitability: "Production workloads, automated self-healing, critical microservices"
      blast_radius: "10% maximum during initial public phase; 0% during tag probe phase"
      rollback_speed_seconds: 1.5
      cost_overhead: "Low (Cloud Run scales only for active traffic requests)"
      zero_downtime: true
      data_corruption_risk: "Very Low"
      description: >-
        Deploys candidate with dedicated URL tag (0% traffic). Runs deterministic synthetic
        probes. Once certified, steps traffic (10% -> 25% -> 50% -> 100%) while continuously
        measuring error rates against the stable baseline. Instant rollback on any policy breach.

    - id: "blue_green"
      name: "Blue/Green Instant Cutover"
      recommended: false
      suitability: "Long-lived monolithic services, non-HTTP workers, full stack migrations"
      blast_radius: "100% upon traffic switch"
      rollback_speed_seconds: 1.0
      cost_overhead: "High (Requires 200% parallel running capacity on standby)"
      zero_downtime: true
      data_corruption_risk: "Medium (if faulty revision executes mutating DB writes before rollback)"
      description: >-
        Deploys an entirely parallel 'Green' revision alongside 'Blue'. Runs pre-flight checks,
        then flips 100% traffic instantly from Blue to Green. While rollback is instantaneous,
        any latent bug immediately impacts 100% of all incoming requests upon cutover.

    - id: "shadow_traffic"
      name: "Shadow / Dark Launch (Traffic Mirroring)"
      recommended: false
      suitability: "High-volume read-only APIs, machine learning inference models, caching layers"
      blast_radius: "0% (Zero live user impact)"
      rollback_speed_seconds: 0.0
      cost_overhead: "Medium (Duplicates incoming request traffic downstream)"
      zero_downtime: true
      data_corruption_risk: "High for mutating writes (risk of duplicate payments or order creation)"
      description: >-
        Asynchronously clones real production traffic to the candidate revision. Real users never
        receive candidate responses. Excellent for validating performance and error rates under real
        traffic loads, but unsafe for state-mutating transactional services without custom mocking.

    - id: "rolling_update"
      name: "Rolling Update (Instance Replacement)"
      recommended: false
      suitability: "Traditional Kubernetes daemonsets or stateful container clusters"
      blast_radius: "Proportional to instance replacement batch size (e.g. 20-33%)"
      rollback_speed_seconds: 45.0
      cost_overhead: "Low (Instances are incrementally replaced)"
      zero_downtime: true
      data_corruption_risk: "Medium"
      description: >-
        Progressively drains and replaces container instances one-by-one. Does not support fine-grained
        statistical error-rate delta comparison against a stable baseline, and rollbacks require
        re-spooling the previous container version, taking up to a minute.

    - id: "direct_recreate"
      name: "Direct Recreate / In-Place"
      recommended: false
      suitability: "Ephemeral development sandboxes, internal non-critical tools"
      blast_radius: "100%"
      rollback_speed_seconds: 120.0
      cost_overhead: "None"
      zero_downtime: false
      data_corruption_risk: "High"
      description: >-
        Immediately cuts off the old revision and deploys the new revision in-place. Incurs service
        downtime during spin-up. If faulty, recovery requires a full rebuild and re-deployment.
        Strictly forbidden for production recovery loops.

# ==============================================================================
# CANARY PROGRESSION STAGES (Used when recommended strategy is selected)
# ==============================================================================
rollout:
  stages:
    - traffic_percent: 0
      name: "tag_isolation"
      min_duration_seconds: 3
      required_samples: 10
    - traffic_percent: 10
      name: "canary_initial"
      min_duration_seconds: 5
      required_samples: 20
    - traffic_percent: 25
      name: "canary_expansion"
      min_duration_seconds: 5
      required_samples: 25
    - traffic_percent: 50
      name: "half_traffic"
      min_duration_seconds: 5
      required_samples: 25
    - traffic_percent: 100
      name: "full_promotion"
      min_duration_seconds: 5
      required_samples: 20

# Evaluation gates: any breach triggers instant rollback and incident detection
thresholds:
  # Absolute thresholds for candidate
  error_rate_max: 0.02              # Max 2% error rate permitted on candidate
  p95_latency_ms_max: 300.0         # Max 300ms p95 latency permitted
  health_endpoint_success_rate: 1.0 # 100% success required on /healthz

  # Comparison against stable baseline
  max_error_rate_delta: 0.01        # Candidate error rate cannot exceed stable by more than 1.0 percentage points
  max_latency_ratio: 1.30           # Candidate p95 latency cannot exceed stable p95 by more than 30%
  latency_ratio_min_delta_ms: 50.0  # ...and only when the p95 slowdown is also > 50 ms (avoids ms-scale noise)

  # SRE Error Budget & Statistical Hypothesis Testing (Principal SRE Tier)
  slo_target: 0.999                 # 99.9% availability SLO (0.1% allowable failure budget)
  max_error_budget_burn_rate: 14.4  # SRE Multi-Window Multi-Burn-Rate 1-hour exhaustion threshold (Page-1)
  mann_whitney_u_significance: 0.05 # Non-parametric p-value confidence limit for certifying latency degradation


# Synthetic probe configuration
probe:
  concurrency: 5
  timeout_seconds: 4.0
  endpoints:
    - path: "/healthz"
      method: "GET"
      weight: 2
      expected_status: 200
    - path: "/api/v1/orders"
      method: "GET"
      weight: 3
      expected_status: 200
    # POST payloads must match the demo app's OrderCreate schema (app/app/routes/orders.py):
    # customer_id, customer_tier, items[{item_id, quantity, unit_price}].
    # Real clients send tier names in any casing, so the probe does too; without the
    # mixed-case requests the seeded fault (docs/demo/fault-discount-lookup.patch) is invisible.
    - path: "/api/v1/orders"
      method: "POST"
      weight: 2
      expected_status: 201
      payload:
        customer_id: "cust-synthetic-probe"
        customer_tier: "standard"
        items:
          - item_id: "sku-sentinel-probe"
            quantity: 2
            unit_price: 49.99
    - path: "/api/v1/orders"
      method: "POST"
      weight: 1
      expected_status: 201
      payload:
        customer_id: "cust-synthetic-probe"
        customer_tier: "premium"
        items:
          - item_id: "sku-sentinel-probe"
            quantity: 2
            unit_price: 49.99
    - path: "/api/v1/orders"
      method: "POST"
      weight: 1
      expected_status: 201
      payload:
        customer_id: "cust-synthetic-probe"
        customer_tier: "Premium"
        items:
          - item_id: "sku-sentinel-probe"
            quantity: 2
            unit_price: 49.99
    - path: "/api/v1/orders"
      method: "POST"
      weight: 1
      expected_status: 201
      payload:
        customer_id: "cust-synthetic-probe"
        customer_tier: "ENTERPRISE"
        items:
          - item_id: "sku-sentinel-probe"
            quantity: 2
            unit_price: 49.99

# Rollback policies
rollback:
  auto_rollback_on_breach: true
  post_rollback_probe_samples: 15
  post_rollback_max_error_rate: 0.00
  notification_channels:
    - "sentinel-backend-events"

# Cloud FinOps & Carbon Intensity Budget Gate (Task K-FinOps)
finops_budget:
  monthly_budget_usd: 250.00          # Maximum monthly cloud spend limit for candidate release ($ USD)
  max_cost_increase_pct: 25.0         # Cost delta alert threshold (% increase vs stable baseline)
  max_carbon_intensity_gco2: 450.0    # Grid carbon intensity ceiling (gCO2eq/kWh)
  enforce_budget_gate: true           # Enforce hard pass/fail gate before progressive canary promotion

# Multi-Region Cloud Resilience & Dynamic Traffic Rebalancing Policy
traffic_rebalancing:
  latency_breach_threshold_ms: 180.0   # SLA ceiling for primary region P99 latency before traffic shedding
  max_error_rate_threshold: 0.02       # Regional error rate limit (2%) before traffic evacuation
  pre_warm_probe_count: 10             # Number of priming probes dispatched to secondary container pool
  min_active_standby_pct: 10           # Minimum warm standby traffic weight on secondary region
  auto_rebalance_on_breach: true       # Automatically trigger Anycast dynamic traffic split on breach
