# Project Sentinel — Authoritative GitLab CI/CD Pipeline
# Implements the complete evidence-backed recovery loop:
# AI proposes changes; deterministic gates decide; CI executes actions.

stages:
  - lint
  - test
  - security
  - infra
  - deploy-canary
  - evaluate-canary
  - rollback
  - evidence
  - gate-verify
  - auto-merge
  - redeploy

variables:
  PYTHONUNBUFFERED: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SENTINEL_BACKEND_URL: "http://sentinel-backend:8000"
  # SENTINEL_HMAC_SECRET is deliberately NOT set here: this repo is public. Define it as a
  # protected + masked project variable (same value as the backend's secret).
  GCP_PROJECT_ID: "project-sentinel-hackathon"
  GCP_REGION: "us-central1"
  GCP_FAILOVER_REGION: "us-east1"
  TARGET_APP_SERVICE: "sentinel-target-app"
  SENTINEL_ENV: "prod"
  SENTINEL_DRY_RUN: "false"
  # Terraform Security Variable Mappings (Injected via TF_VAR_* without hardcoded secrets)
  TF_VAR_project_id: "$GCP_PROJECT_ID"
  TF_VAR_region: "$GCP_REGION"
  TF_VAR_failover_region: "$GCP_FAILOVER_REGION"
  TF_VAR_environment: "$SENTINEL_ENV"
  TF_VAR_initial_hmac_secret: "$SENTINEL_HMAC_SECRET"
  TF_VAR_gitlab_project_path: "$CI_PROJECT_PATH"


cache:
  paths:
    - .cache/pip

# ==============================================================================
# DEVSECOPS 9-STAGE FULL LIFECYCLE AUDIT (Hackathon Prize: Most Stages Covered)
# ==============================================================================
lifecycle:9-stage-audit:
  stage: lint
  image: python:3.11-slim
  script:
    - echo "==> Validating 9-Stage DevSecOps Lifecycle orchestration and coverage"
    - python sentinel/scripts/lifecycle_orchestrator.py --output-dir artifacts
  artifacts:
    when: always
    paths:
      - artifacts/devsecops-9-stage-lifecycle-report.json

plan:finops-greenops:
  stage: lint
  image: python:3.11-slim
  script:
    - echo "==> [Stage: PLAN] FinOps Forecast & ISO/IEC 21031 SCI Carbon Assessment"
    - python sentinel/scripts/finops_engine.py --dry-run
    - python sentinel/scripts/sci_carbon_engine.py --dry-run
  artifacts:
    when: always
    paths:
      - artifacts/finops-spend-forecast.json
      - artifacts/finops-cloud-cost-report.json
      - artifacts/sci-carbon-intensity.json
      - artifacts/sci-carbon-intensity-report.json

# ==============================================================================
# STAGE 1: LINT & CONTRACT INTEGRITY
# ==============================================================================
lint:quality-gate:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install ruff pyyaml jsonschema
  script:
    - echo "==> Running Ruff linter"
    - ruff check .
    - echo "==> Validating OpenAPI 3.1.0 and CI Event JSON Schema"
    - python -c "import yaml, json, jsonschema; openapi = yaml.safe_load(open('docs/contracts/openapi.yaml', encoding='utf-8')); schema = json.load(open('docs/contracts/event.schema.json', encoding='utf-8')); jsonschema.Draft202012Validator.check_schema(schema); assert 'paths' in openapi; print('Contracts valid!')"

# ==============================================================================
# STAGE 2: UNIT & COMPONENT TEST SUITES
# ==============================================================================
test:app:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r app/requirements.txt pytest pytest-cov
  script:
    - echo "==> Running Demo Target App test suite"
    - pytest -v --junitxml=junit-app.xml --cov=app/app app/tests
  artifacts:
    when: always
    reports:
      junit: junit-app.xml
    paths:
      - junit-app.xml

test:backend:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r backend/requirements.txt pytest pytest-cov
  script:
    - echo "==> Running Sentinel Backend test suite"
    - pytest -v --junitxml=junit-backend.xml --cov=backend/app backend/tests
  artifacts:
    when: always
    reports:
      junit: junit-backend.xml
    paths:
      - junit-backend.xml

test:sentinel-gates:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r backend/requirements.txt pytest pytest-cov
  script:
    - echo "==> Running Sentinel Gates test suite (Integrity Gate, Regression Proof, Evaluator, SAST, Statistical Analyzer, Chaos, Supply Chain)"
    - pytest -v --junitxml=junit-sentinel.xml tests/
  artifacts:
    when: always
    reports:
      junit: junit-sentinel.xml
    paths:
      - junit-sentinel.xml

chaos:resilience-simulation:
  stage: test
  image: python:3.11-slim
  script:
    - echo "==> Executing Chaos Engineering & Canary Circuit Breaker Simulation"
    - python sentinel/scripts/chaos_engine.py --fault intermittent_503 --iterations 15
  artifacts:
    when: always
    paths:
      - artifacts/chaos-resilience-report.json

chaos:multi-region-dr-drill:
  stage: test
  image: python:3.11-slim
  script:
    - echo "==> Running Multi-Region Zero-Downtime DR Simulation (RTO < 5s, RPO = 0s)"
    - python sentinel/scripts/disaster_recovery.py
  artifacts:
    when: always
    paths:
      - artifacts/disaster-recovery-report.json

chaos:cloud-traffic-rebalance:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install pyyaml
  script:
    - echo "==> Running Multi-Region Cloud Resilience & Dynamic Traffic Rebalancing Drill"
    - python sentinel/scripts/cloud_traffic_rebalancer.py --output-dir artifacts
  artifacts:
    when: always
    paths:
      - artifacts/cloud-traffic-rebalance-report.json

test:ebpf-kernel-telemetry:
  stage: test
  image: python:3.11-slim
  script:
    - echo "==> Running L4/L7 eBPF Kernel Transport & TLS Latency Decomposition"
    - python sentinel/scripts/ebpf_tracer.py --samples 15
  artifacts:
    when: always
    paths:
      - artifacts/ebpf-telemetry-report.json

test:drift-detection:
  stage: test
  image: python:3.11-slim
  script:
    - echo "==> Running Statistical EWMA & CUSUM Adaptive Drift Detector"
    - python sentinel/scripts/drift_detector.py
  artifacts:
    when: always
    paths:
      - artifacts/drift-analysis-report.json

# ==============================================================================
# STAGE 3: SECURITY, SAST & SLSA PROVENANCE (Tasks K8, Principal SRE)
# ==============================================================================
security:sast-gate:
  stage: security
  image: python:3.11-slim
  script:
    - echo "==> Running Sentinel SAST and Secret Scanner Gate"
    - python sentinel/scripts/sast_gate.py --dirs app backend sentinel --output-dir artifacts
  artifacts:
    when: always
    paths:
      - artifacts/sast-report.json

security:slsa-attestation:
  stage: security
  image: python:3.11-slim
  script:
    - echo "==> Generating in-toto SLSA Level 3 Provenance & CycloneDX SBOM"
    - python sentinel/scripts/supply_chain_attestation.py --image "us-central1-docker.pkg.dev/project-sentinel/sentinel/target-app:${CI_COMMIT_SHA:-latest}" --commit-sha "${CI_COMMIT_SHA:-localdev}" --output-dir artifacts
  artifacts:
    when: always
    paths:
      - artifacts/attestation-*.json

security:opa-rego-guardrails:
  stage: security
  image: python:3.11-slim
  script:
    - echo "==> Evaluating Open Policy Agent (OPA) Rego Zero-Trust Guardrails"
    - python sentinel/scripts/opa_validator.py --output artifacts/opa-compliance-report.json
  artifacts:
    when: always
    paths:
      - artifacts/opa-compliance-report.json

security:cosign-keyless-verify:
  stage: security
  image: python:3.11-slim
  script:
    - echo "==> Verifying Sigstore Cosign Keyless Provenance & Rekor Transparency Log"
    - python sentinel/scripts/cosign_verifier.py --commit-sha "${CI_COMMIT_SHA:-localdev}"
  artifacts:
    when: always
    paths:
      - artifacts/cosign-verification-report.json

security:cyclonedx-vex:
  stage: security
  image: python:3.11-slim
  script:
    - echo "==> Generating CycloneDX Vulnerability Exploitability eXchange (VEX)"
    - python sentinel/scripts/cyclonedx_vex.py --dry-run
  artifacts:
    when: always
    paths:
      - artifacts/cyclonedx-vex-report.json
      - artifacts/cyclonedx-vex-attestation.json

security:kms-envelope-audit:
  stage: security
  image: python:3.11-slim
  script:
    - echo "==> Auditing Multi-Cloud KMS Envelope Encryption & 90-Day Key Rotation"
    - python sentinel/scripts/kms_auditor.py --dry-run
  artifacts:
    when: always
    paths:
      - artifacts/kms-rotation-report.json
      - artifacts/kms-rotation-audit-report.json

security:cloud-armor-waf:
  stage: security
  image: python:3.11-slim
  script:
    - echo "==> Enforcing Google Cloud Armor Adaptive WAF Layer 7 Mitigations"
    - python sentinel/scripts/cloud_armor_mitigator.py --dry-run
  artifacts:
    when: always
    paths:
      - artifacts/cloud-armor-waf-report.json
      - artifacts/cloud-armor-threat-mitigation-report.json

govern:cis-zero-trust:
  stage: security
  image: python:3.11-slim
  script:
    - echo "==> [Stage: GOVERN] CIS Multi-Cloud Zero-Trust Benchmark Audit"
    - python sentinel/scripts/cis_governance_guard.py --dry-run
  artifacts:
    when: always
    paths:
      - artifacts/cis-governance-report.json
      - artifacts/governance-compliance-report.json



# ==============================================================================
# STAGE 4: TERRAFORM INFRASTRUCTURE VALIDATION (Tasks K1, K2)
# ==============================================================================
infra:terraform-validate:
  stage: infra
  image: hashicorp/terraform:1.7
  script:
    - cd infra
    - terraform init -backend=false
    - terraform fmt -check
    - terraform validate
  rules:
    - changes:
        - infra/**/*

infra:s3-state-audit:
  stage: infra
  image: python:3.11-slim
  before_script:
    - pip install boto3 botocore
  script:
    - echo "==> Running Enterprise S3 Remote State & DynamoDB Distributed Lock Audit"
    - python sentinel/scripts/s3_state_manager.py audit
  artifacts:
    when: always
    paths:
      - artifacts/s3-state-audit-report.json

infra:finops-carbon-guard:
  stage: infra
  image: python:3.11-slim
  before_script:
    - pip install pyyaml
  script:
    - echo "==> Evaluating Multi-Cloud FinOps Spend Budget & GreenOps Carbon Intensity"
    - python sentinel/scripts/finops_guard.py --policy sentinel/policy.yaml --output-dir artifacts
  artifacts:
    when: always
    paths:
      - artifacts/finops-cloud-cost-report.json


# ==============================================================================
# STAGE 5: CANARY DEPLOYMENT (Task K4)
# ==============================================================================
deploy:canary:
  stage: deploy-canary
  image: python:3.11-slim
  before_script:
    - pip install pyyaml jsonschema requests
  script:
    - echo "==> Deploying candidate release to Cloud Run with 0% initial traffic tag"
    - extra_args="" ; if [ "$SENTINEL_DRY_RUN" = "true" ]; then extra_args="--dry-run"; fi
    - python sentinel/scripts/canary_deploy.py --service $TARGET_APP_SERVICE --traffic-percent 10 $extra_args
  artifacts:
    paths:
      - artifacts/canary-deploy-report.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"

# ==============================================================================
# STAGE 6: HEALTH EVALUATION (Task K5)
# ==============================================================================
evaluate:canary-step:
  stage: evaluate-canary
  image: python:3.11-slim
  before_script:
    - pip install pyyaml jsonschema requests
  script:
    - echo "==> Running Authoritative Sentinel Health Evaluator"
    - python sentinel/scripts/evaluator.py --candidate-url "http://sentinel-target-app:8080" --traffic-percent 10 || exit_code=$?
    - if [ "$exit_code" -eq 2 ]; then echo "Evaluator detected regression! Triggering rollback."; exit 2; fi
  artifacts:
    when: always
    paths:
      - artifacts/evaluator-report.json
      - artifacts/evaluator-report.md
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"

# ==============================================================================
# STAGE 7: AUTOMATED ROLLBACK (Task K6)
# ==============================================================================
rollback:on-breach:
  stage: rollback
  image: python:3.11-slim
  before_script:
    - pip install jsonschema requests
  script:
    - echo "==> Reverting 100% traffic to last known-good revision"
    - extra_args="" ; if [ "$SENTINEL_DRY_RUN" = "true" ]; then extra_args="--dry-run"; fi
    - python sentinel/scripts/rollback.py --service $TARGET_APP_SERVICE --stable-url "http://sentinel-target-app:8080" $extra_args
  artifacts:
    when: always
    paths:
      - artifacts/rollback-report.json
  rules:
    - if: ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main")
      when: on_failure

# ==============================================================================
# STAGE 8: REDACTED EVIDENCE BUNDLE (Task K7)
# ==============================================================================
evidence:collect:
  stage: evidence
  image: python:3.11-slim
  before_script:
    - pip install jsonschema requests
  script:
    - echo "==> Constructing redacted evidence bundle & computing authoritative SHA-256"
    - extra_args="" ; if [ "$SENTINEL_DRY_RUN" = "true" ]; then extra_args="--dry-run"; fi
    - python sentinel/scripts/evidence_collector.py --service $TARGET_APP_SERVICE $extra_args
    # Fixed name so the Duo investigation flow can fetch the bundle from this job's artifacts
    - cp "$(ls -t artifacts/evidence-bundle-*.json | head -1)" artifacts/evidence-bundle.json
  artifacts:
    when: always
    paths:
      - artifacts/evidence-bundle-*.json
      - artifacts/evidence-bundle.json
  rules:
    - if: ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main")
      when: on_failure

# ==============================================================================
# STAGE 9: VERIFICATION GATES ON REPAIR MRs (Tasks S5, S6, K9)
# ==============================================================================
.repair-mr-gate:
  stage: gate-verify
  image: python:3.11-slim
  variables:
    GIT_DEPTH: "0"          # both the broken (MR base) and fix SHAs must be present
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - pip install -q -r app/requirements.txt pytest jsonschema
    - mkdir -p artifacts
    # Repair branches are duo/fix/inc-<id>; the regression test is tests/regressions/test_inc_<id>.py
    - export INCIDENT_ID="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME#duo/fix/}"
    - export REGRESSION_TEST="tests/regressions/test_$(echo "$INCIDENT_ID" | tr '-' '_').py"
  rules:
    - if: $CI_MERGE_REQUEST_IID && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^duo\/fix\//

gate:regression-proof:
  extends: .repair-mr-gate
  script:
    - echo "==> Regression proof for $INCIDENT_ID: $REGRESSION_TEST must fail with an assertion on $CI_MERGE_REQUEST_DIFF_BASE_SHA and pass on $CI_COMMIT_SHA"
    - status=0
    - python sentinel/scripts/regression_proof.py --broken "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --fix "$CI_COMMIT_SHA" --test "$REGRESSION_TEST" --output-json artifacts/regression-proof.json --output-junit artifacts/regression-proof.xml || status=$?
    - python sentinel/scripts/report_gate_verdict.py --gate regression_proof --report artifacts/regression-proof.json --incident-id "$INCIDENT_ID"
    - exit $status
  artifacts:
    when: always
    paths:
      - artifacts/regression-proof.json
      - artifacts/regression-proof.xml
    reports:
      junit: artifacts/regression-proof.xml

gate:integrity-gate:
  extends: .repair-mr-gate
  script:
    - echo "==> Integrity Gate on the repair diff $CI_MERGE_REQUEST_DIFF_BASE_SHA...$CI_COMMIT_SHA"
    - status=0
    - python sentinel/scripts/integrity_gate.py --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA" --output-json artifacts/integrity-gate.json --output-junit artifacts/integrity-gate.xml || status=$?
    - python sentinel/scripts/report_gate_verdict.py --gate integrity --report artifacts/integrity-gate.json --incident-id "$INCIDENT_ID"
    - exit $status
  artifacts:
    when: always
    paths:
      - artifacts/integrity-gate.json
      - artifacts/integrity-gate.xml
    reports:
      junit: artifacts/integrity-gate.xml

# ==============================================================================
# STAGE 10: AUTONOMOUS MERGE (Task K10)
# ==============================================================================
merge:auto-merge:
  stage: auto-merge
  image: python:3.11-slim
  before_script:
    - pip install jsonschema requests
  # Runs only after both gate jobs succeeded (same pipeline, earlier stage), and reads their reports.
  needs:
    - job: gate:regression-proof
      artifacts: true
    - job: gate:integrity-gate
      artifacts: true
  script:
    - echo "==> All required gates green. Merging with the project token (GITLAB_PROJECT_TOKEN, masked)"
    - python sentinel/scripts/auto_merge.py --project-id "$CI_PROJECT_ID" --mr-iid "$CI_MERGE_REQUEST_IID" --fix-sha "$CI_COMMIT_SHA" --incident-id "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME#duo/fix/}"
  rules:
    - if: $CI_MERGE_REQUEST_IID && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^duo\/fix\//
