openapi: 3.1.0
info:
  title: Project Sentinel API
  version: 1.0.0
  description: >
    Sentinel API backend for GitLab Transcend Hackathon ('Life After Code').
    Provides real-time deployment safety tracking, CI stage event ingestion,
    incident lifecycle management, and Mission Control UI telemetry.
servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://sentinel-api.run.app
    description: Production Google Cloud Run service

paths:
  /api/v1/healthz:
    get:
      summary: Backend Liveness Probe
      description: Returns liveness status and backend version.
      operationId: getHealthz
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - version
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: sentinel-backend
                  version:
                    type: string
                    example: 1.0.0

  /api/v1/status:
    get:
      summary: Current System & Rollout Status
      description: >
        Returns the active production release, active canary release (if deploying),
        current traffic split percentages, latest health metrics, and active incident state.
      operationId: getSystemStatus
      responses:
        '200':
          description: Current system operational status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/events:
    post:
      summary: Ingest CI / Pipeline Stage Event
      description: >
        Ingests stage telemetry and gate results from GitLab CI jobs.
        Must be signed with HMAC-SHA256 using the shared CI secret.
      operationId: ingestCiEvent
      parameters:
        - in: header
          name: X-Sentinel-Signature
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature (e.g. sha256=abcdef...)
        - in: header
          name: X-Sentinel-Timestamp
          required: true
          schema:
            type: string
          description: ISO-8601 timestamp or Unix epoch seconds when the request was signed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CiEvent'
      responses:
        '202':
          description: Event accepted and queued for state machine evaluation
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - event_id
                  - received_at
                properties:
                  status:
                    type: string
                    example: accepted
                  event_id:
                    type: string
                    example: evt-98dfa2-34
                  received_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/webhooks/gitlab:
    post:
      summary: GitLab System Webhook Receiver
      description: Ingests pipeline, job, and merge request lifecycle webhooks directly from GitLab.
      operationId: handleGitLabWebhook
      parameters:
        - in: header
          name: X-Gitlab-Token
          required: true
          schema:
            type: string
          description: GitLab webhook secret token configured in project settings.
        - in: header
          name: X-Gitlab-Event
          required: false
          schema:
            type: string
          description: GitLab webhook event type (e.g. Pipeline Hook, Job Hook, Merge Request Hook).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: processed
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/releases:
    get:
      summary: List Releases
      description: Returns chronological release history with canary/stable statuses.
      operationId: listReleases
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: List of releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Release'

  /api/v1/releases/{id}:
    get:
      summary: Get Release Details
      description: Returns release metadata, linked deployment stages, and associated health samples.
      operationId: getReleaseById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Release details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/incidents:
    get:
      summary: List Incidents
      description: Returns history of detected incidents and their recovery status.
      operationId: listIncidents
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [OPEN, INVESTIGATING, REPAIR_PROPOSED, VERIFYING, MERGED, REDEPLOYING, RECOVERED, TIMED_OUT, VERIFICATION_FAILED, ESCALATED]
      responses:
        '200':
          description: List of incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'

  /api/v1/incidents/{id}:
    get:
      summary: Get Incident Detail
      description: Returns detailed incident state including recovery attempts, analysis, gate results, and test results.
      operationId: getIncidentById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Incident detail record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/incidents/{id}/timeline:
    get:
      summary: Get Incident Event Timeline
      description: Returns strictly chronological events with evidence references for the Mission Control hero view.
      operationId: getIncidentTimeline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chronological list of events for the incident
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEvent'
        '404':
          $ref: '#/components/responses/ErrorResponse'

components:
  responses:
    ErrorResponse:
      description: Standard API Error Format
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              example: INVALID_SIGNATURE
            message:
              type: string
              example: HMAC signature verification failed
            retryable:
              type: boolean
              example: false

    SystemStatus:
      type: object
      required:
        - current_release
        - traffic_split
        - system_health
        - active_incident
      properties:
        current_release:
          $ref: '#/components/schemas/Release'
        candidate_release:
          $ref: '#/components/schemas/Release'
        traffic_split:
          type: object
          required:
            - stable_percent
            - candidate_percent
          properties:
            stable_percent:
              type: integer
              example: 90
            candidate_percent:
              type: integer
              example: 10
        system_health:
          type: object
          required:
            - error_rate
            - p95_ms
            - healthy
          properties:
            error_rate:
              type: number
              format: float
              example: 0.002
            p95_ms:
              type: number
              format: float
              example: 45.2
            healthy:
              type: boolean
              example: true
        active_incident:
          $ref: '#/components/schemas/Incident'

    Release:
      type: object
      required:
        - id
        - commit_sha
        - version
        - pipeline_id
        - status
        - known_good
        - created_at
      properties:
        id:
          type: string
          example: rel-20261018-01
        commit_sha:
          type: string
          example: c9aaa1fac0a16d44677e19b431ec4e79bf4da53d
        version:
          type: string
          example: 1.0.0
        image_digest:
          type: string
          example: sha256:4b227777d4dd1fc61c6f884f48641d02b4d121d3fd3a4830c5b7b7f541d15c4e
        revision_name:
          type: string
          example: target-app-00004-abc
        pipeline_id:
          type: string
          example: '14529340'
        status:
          type: string
          enum: [DEPLOYING, STABLE, CANARY, ROLLED_BACK, FAILED]
          example: STABLE
        known_good:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time

    Deployment:
      type: object
      required:
        - id
        - release_id
        - stage
        - traffic_percent
        - started_at
      properties:
        id:
          type: string
          example: dep-001
        release_id:
          type: string
          example: rel-20261018-01
        stage:
          type: string
          enum: [CANARY_10, CANARY_50, PROD_100, ROLLBACK]
          example: CANARY_10
        traffic_percent:
          type: integer
          example: 10
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        verdict:
          type: string
          enum: [PASS, FAIL, IN_PROGRESS]
        evaluator_job_id:
          type: string
          example: '459102'

    HealthSample:
      type: object
      required:
        - id
        - deployment_id
        - target
        - error_rate
        - p95_ms
        - health_ok
        - sample_size
        - measured_at
      properties:
        id:
          type: string
          example: smp-101
        deployment_id:
          type: string
          example: dep-001
        target:
          type: string
          enum: [candidate, stable]
        error_rate:
          type: number
          format: float
          example: 0.05
        p95_ms:
          type: number
          format: float
          example: 180.5
        health_ok:
          type: boolean
          example: false
        sample_size:
          type: integer
          example: 500
        measured_at:
          type: string
          format: date-time

    Incident:
      type: object
      required:
        - id
        - release_id
        - detected_at
        - breached_thresholds
        - status
      properties:
        id:
          type: string
          example: inc-20261018-01
        release_id:
          type: string
          example: rel-20261018-02
        detected_at:
          type: string
          format: date-time
        breached_thresholds:
          type: array
          items:
            type: string
          example: ["error_rate > 0.02 (observed 0.08)", "p95_ms > 200ms (observed 450ms)"]
        evidence_bundle_ref:
          type: string
          example: https://gitlab.com/api/v4/projects/123/jobs/9988/artifacts/evidence.tar.gz
        evidence_sha256:
          type: string
          example: 7f83b1657ff1fc53b92dc18148a1d65dfc2d4b1fa3d677284addd200126d9069
        status:
          type: string
          enum: [DETECTED, ROLLED_BACK, EVIDENCE_COLLECTED, INVESTIGATING, REPAIR_PROPOSED, VERIFYING, MERGED, REDEPLOYING, RECOVERED, ROLLBACK_FAILED, INVESTIGATION_FAILED, VERIFICATION_FAILED, REDEPLOY_UNHEALTHY, TIMED_OUT, ESCALATED]
          example: INVESTIGATING

    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/Incident'
        - type: object
          properties:
            recovery_attempts:
              type: array
              items:
                $ref: '#/components/schemas/RecoveryAttempt'

    RecoveryAttempt:
      type: object
      required:
        - id
        - incident_id
        - attempt_no
        - state
      properties:
        id:
          type: string
          example: att-01
        incident_id:
          type: string
          example: inc-20261018-01
        attempt_no:
          type: integer
          example: 1
        state:
          type: string
          enum: [DETECTED, ROLLED_BACK, EVIDENCE_COLLECTED, INVESTIGATING, REPAIR_PROPOSED, VERIFYING, MERGED, REDEPLOYING, RECOVERED, FAILED]
          example: REPAIR_PROPOSED
        flow_session_id:
          type: string
          example: duo-session-789
        mr_iid:
          type: integer
          example: 42
        fix_sha:
          type: string
          example: d91e4f2a7
        failure_reason:
          type: string
        deadline_at:
          type: string
          format: date-time
        analysis:
          $ref: '#/components/schemas/Analysis'
        test_results:
          type: array
          items:
            $ref: '#/components/schemas/TestResult'
        gate_results:
          type: array
          items:
            $ref: '#/components/schemas/GateResult'

    Analysis:
      type: object
      required:
        - attempt_id
        - facts
        - hypotheses
        - missing_evidence
      properties:
        attempt_id:
          type: string
          example: att-01
        facts:
          type: array
          items:
            type: string
          example: ["Error rate increased to 8% immediately following deployment of commit abc1234"]
        hypotheses:
          type: array
          items:
            type: string
          example: ["ZeroDivisionError in app/routes/orders.py:calculate_discount when quantity is zero"]
        missing_evidence:
          type: array
          items:
            type: string
          example: ["Database connection pool metrics during the spike"]
        suspected_change:
          type: string
          example: app/routes/orders.py line 45
        file_ref:
          type: string
          example: sentinel/incidents/inc-20261018-01/analysis.json

    TestResult:
      type: object
      required:
        - id
        - attempt_id
        - kind
        - sha
        - outcome
      properties:
        id:
          type: string
          example: tst-01
        attempt_id:
          type: string
          example: att-01
        kind:
          type: string
          enum: [regression_on_broken, regression_on_fix, suite]
        sha:
          type: string
          example: abc1234
        outcome:
          type: string
          enum: [PASSED, FAILED, ERROR]
        failure_type:
          type: string
          example: AssertionError
        junit_ref:
          type: string
          example: https://gitlab.com/api/v4/projects/123/jobs/9989/artifacts/junit.xml

    GateResult:
      type: object
      required:
        - id
        - attempt_id
        - gate
        - verdict
        - findings
      properties:
        id:
          type: string
          example: gte-01
        attempt_id:
          type: string
          example: att-01
        gate:
          type: string
          enum: [integrity, sast, sonar, terraform]
        verdict:
          type: string
          enum: [pass, fail, warn]
        findings:
          type: array
          items:
            type: string
          example: []
        report_ref:
          type: string
          example: https://gitlab.com/api/v4/projects/123/jobs/9990/artifacts/integrity_report.json

    CiEvent:
      type: object
      required:
        - type
        - source
        - pipeline_id
        - job_id
        - commit_sha
        - data
        - sent_at
      properties:
        type:
          type: string
          enum:
            - pipeline.started
            - deploy.canary_started
            - evaluator.verdict
            - rollback.started
            - rollback.completed
            - incident.detected
            - evidence.collected
            - flow.started
            - flow.completed
            - repair.proposed
            - regression_proof.verdict
            - integrity_gate.verdict
            - merge.completed
            - redeploy.completed
            - recovery.verified
          example: incident.detected
        source:
          type: string
          example: gitlab-ci/evaluator
        pipeline_id:
          type: string
          example: '14529340'
        job_id:
          type: string
          example: '459102'
        commit_sha:
          type: string
          example: c9aaa1fac0a16d44677e19b431ec4e79bf4da53d
        release_id:
          type: string
          example: rel-20261018-02
        incident_id:
          type: string
          example: inc-20261018-01
        data:
          type: object
          description: Structured event-specific payload
        artifact_url:
          type: string
          format: uri
          example: https://gitlab.com/api/v4/projects/123/jobs/459102/artifacts/bundle.tar.gz
        sent_at:
          type: string
          format: date-time

    TimelineEvent:
      type: object
      required:
        - id
        - entity_type
        - entity_id
        - type
        - source
        - source_job_id
        - at
      properties:
        id:
          type: string
          example: evt-501
        entity_type:
          type: string
          enum: [Release, Incident, RecoveryAttempt]
          example: Incident
        entity_id:
          type: string
          example: inc-20261018-01
        type:
          type: string
          example: incident.detected
        source:
          type: string
          example: sentinel/scripts/evaluator.py
        source_job_id:
          type: string
          example: '459102'
        at:
          type: string
          format: date-time
        payload_ref:
          type: string
        summary:
          type: string
          example: Canary error rate threshold breached (8% > 2% max allowed)
        evidence_url:
          type: string
          format: uri
